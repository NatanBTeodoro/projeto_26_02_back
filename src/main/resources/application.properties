spring.application.name=projeto

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:menu_engineering}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

app.cors.origens=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.semente.habilitada=${SEMENTE:true}
app.semente.email=${SEMENTE_EMAIL:admin@admin.com}
app.semente.senha=${SEMENTE_SENHA:Admin123}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.cache.time-to-live=10s
