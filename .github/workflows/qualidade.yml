name: Qualidade

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Subir o Postgres
        run: docker compose up -d --wait --wait-timeout 120 db

      - name: Testes
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: menu_engineering
          PGUSER: quadrante
          PGPASSWORD: quadrante
          PGSSLMODE: disable
        run: bash mvnw -B test
