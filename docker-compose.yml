services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menu_engineering
      POSTGRES_USER: quadrante
      POSTGRES_PASSWORD: quadrante
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quadrante -d menu_engineering"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: menu_engineering
      PGUSER: quadrante
      PGPASSWORD: quadrante
      PGSSLMODE: disable
      DB_POOL: 5
    ports:
      - "8080:8080"

volumes:
  pgdata:
